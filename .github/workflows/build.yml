name: Build dirsize.exe
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross mingw64
        run: sudo apt update && sudo apt install -y mingw-w64

      - name: Compile static console program
        run: x86_64-w64-mingw32-gcc dirsize.c -o dirsize.exe -Wall -static -mconsole

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsize-windows-x64
          path: dirsize.exe
