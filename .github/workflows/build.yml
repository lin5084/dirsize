name: Build dirsize.exe
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile static build
        shell: msys2 {0}
        run: |
          gcc dirsize.c -o dirsize.exe -Wall -static
          ls -l dirsize.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsize-windows-x64
          path: dirsize.exe
