name: Build dirsize.exe
on:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Compile static
        run: zig cc -target x86_64-windows-gnu dirsize.c -o dirsize.exe -Wall -static
      - uses: actions/upload-artifact@v4
        with:
          name: dirsize-zig
          path: dirsize.exe
