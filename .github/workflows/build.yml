name: Build dirsize.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 13.2.0
          arch: x64

      - name: Compile
        run: gcc dirsize.c -o dirsize.exe -Wall

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsize-windows-x64
          path: dirsize.exe
